<!-- new ticket modal -->
<div class="modal fade" id="new_ticket_modal" tabindex="-1" aria-labelledby="new_ticket_modalLabel" aria-hidden="true">
    <div class="modal-dialog modal-dialog-centered modal-dialog-scrollable">
        <div class="modal-content border-0 shadow-lg rounded-4">
            
            <!-- هدر اصلی مدال (دکمه بستن) -->
            <div class="modal-header border-bottom-0 pb-0">
                <button type="button" class="btn-close ms-0 me-auto" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>

            <div class="modal-body pt-0 px-4 pb-4">
                <form method="post" action="{% url 'tickets:new_ticket' %}" enctype="multipart/form-data">
                    {% csrf_token %}
                    
                    <!-- عنوان بخش داخل مدال -->
                    <div class="d-flex align-items-center mb-3 border-bottom pb-2">
                        <i class="bi bi-plus-circle-fill text-success fs-5 ms-2"></i>
                        <h6 class="modal-title fw-bold text-dark m-0" style="font-size: 0.95rem;" id="new_ticket_modalLabel">ثبت تیکت جدید</h6>
                    </div>

                    <div class="ticket-form-body" style="font-size: 0.85rem;">
                        <!-- عنوان تیکت -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary mb-1">عنوان تیکت</label>
                            {{ ticket_form.ticket_title }}
                        </div>

                        <!-- واحد و اولویت در یک ردیف -->
                        <div class="row g-2">
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-secondary mb-1">واحد مقصد</label>
                                {{ ticket_form.destination_unit }}
                            </div>
                            <div class="col-md-6 mb-3">
                                <label class="form-label fw-semibold text-secondary mb-1">اولویت</label>
                                {{ ticket_form.priority }}
                            </div>
                        </div>

                        <!-- شرح -->
                        <div class="mb-3">
                            <label class="form-label fw-semibold text-secondary mb-1">شرح تیکت</label>
                            {{ ticket_form.description }}
                        </div>

                        <!-- ضمیمه -->
                        <div class="mb-4">
                            <label class="form-label fw-semibold text-secondary mb-1">فایل ضمیمه</label>
                            <input type="file" name="files" class="form-control form-control-sm" multiple>
                        </div>
                    </div>

                    <!-- دکمه‌های فوتر -->
                    <div class="modal-footer border-top-0 pt-0 px-0 d-flex justify-content-end gap-2">
                        <button type="button" class="btn btn-outline-secondary btn-sm px-3 rounded-2 fw-medium" data-bs-dismiss="modal">انصراف</button>
                        <button type="submit" class="btn btn-success btn-sm px-4 rounded-2 fw-medium shadow-sm">ارسال تیکت</button>
                    </div>
                </form>
            </div>

        </div>
    </div>
</div>
