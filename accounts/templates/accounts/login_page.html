<!doctype html>
<html lang="fa" dir="rtl">
  <head>
    {% load static %}

    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <!-- Bootstrap -->
    <link
      rel="stylesheet"
      href="{% static 'bootstrap/css/bootstrap.min.css' %}"
    />
    <!-- Costom Style -->
    <link rel="stylesheet" href="{% static 'accounts/login_style.css' %}" />

    <title>ورود به حساب کاربری</title>
  </head>

  <body>
    <div class="login-wrapper">
      <div class="card-glass">
        <div class="text-center mb-4">
          <h3 class="fw-bold mb-2">ورود</h3>
          <p class="text-dark-50 small">اتوماسیون اداری صنایع غذایی درنا</p>
        </div>

        <form action="{% url 'accounts:user_login' %}" method="POST">
          {% csrf_token %}
          <!-- Userame -->
          <div class="input-group mb-3">
            <input
              type="text"
              name="username"
              class="form-control"
              placeholder="نام کاربری"
              required
            />
          </div>

          <!-- Password -->
          <div class="mb-3 position-relative">
            <i class="bi bi-lock input-icon"></i>
            <input
              id="password"
              type="password"
              name="password"
              class="form-control"
              placeholder="رمز عبور"
              required
            />
            <i id="togglePassword" class="bi bi-eye eye-btn"></i>
          </div>

          <!-- Options -->
          <div class="d-flex justify-content-between mb-3">
            <div class="form-check">
              <input class="form-check-input" type="checkbox" />
              <label class="form-check-label">مرا به خاطر بسپار</label>
            </div>
            <a href="#" class="small text-decoration-none">فراموشی رمز؟</a>
          </div>

          <!-- Login Button -->
          <div class="d-grid mb-3">
            <button type="submit" class="btn btn-success btn-login">
              ورود
            </button>
          </div>

          <div class="text-center small">
            حساب ندارید؟ <a href="#">ثبت‌نام</a>
          </div>
        </form>
      </div>
    </div>

    <script>
      // Toggle Password show/hide
      const togglePassword = document.getElementById("togglePassword");
      const password = document.getElementById("password");

      togglePassword.addEventListener("click", () => {
        password.type = password.type === "password" ? "text" : "password";
        togglePassword.classList.toggle("bi-eye");
        togglePassword.classList.toggle("bi-eye-slash");
      });
    </script>

    <script src="{% static 'bootstrap/js/bootstrap.bundle.min.js' %}"></script>
  </body>
</html>
